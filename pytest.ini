[pytest]
# Pytest configuration for TranscriptX
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    smoke: fast, deterministic, no external services/models; required for CI
    unit: Unit tests for individual functions/classes
    optional: optional or slow tests excluded from the default fast release profile
    heavy: excluded from fast local profile due to runtime/setup/dependency surface
    gui_acceptance: Streamlit AppTest acceptance journeys; heavy-gated, not fast lane
    gui_e2e: Playwright E2E against live Streamlit GUI (tests/e2e_gui; opt-in via make test-gui-e2e)
    browser: Playwright browser integration (Theme C; tests/browser; opt-in)
    integration: Integration tests for workflows and pipelines
    contract: Offline contract tests (output shape, no external deps)
    slow: Tests that take longer to run (ML models, file I/O)
    requires_models: Tests that require downloaded ML models
    requires_docker: Tests that require a Docker daemon or containers
    requires_ffmpeg: Tests that require ffmpeg/ffprobe on PATH
    requires_api: Tests that require external API access
    requires_nlp: Tests that require spaCy (nlp extra); excluded from fast CI lane
    integration_core: Stable integration subset for nightly runs
    integration_extended: Extended integration suite (nightly or manual)
    performance: Performance and benchmark tests
    quarantined: Temporarily quarantined tests (must include reason and sunset)
    timeout: Tests that may legitimately take longer than 5 minutes
    release_only: packaging/install smoke reserved for release validation
    legacy: legacy semantic similarity stack; excluded from default CI addopts
    semantic_v2_slow: model-heavy or large synthetic semantic v2 perf tests

# Avoid collecting backups/duplicates that shadow real modules (ImportPathMismatchError).
# Exclude tests/archived (e.g. test_convokit.py) which reference removed/archived code.
norecursedirs =
    transcriptx*backup
    archived

# Output options: fast local default.
# Heavy profile is selected explicitly via make/marker commands.
addopts = 
    -ra
    --strict-markers
    --strict-config
    --import-mode=importlib
    --verbose
    --tb=short
    --timeout=300
    --timeout-method=thread
    -m "not quarantined and not smoke and not release_only and not integration and not integration_core and not integration_extended and not requires_ffmpeg and not requires_docker and not requires_models and not requires_api and not requires_nlp and not slow and not legacy and not semantic_v2_slow and not gui_acceptance and not gui_e2e and not browser"

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:transformers.*
    ignore::UserWarning:torch.*
    ignore::UserWarning:sklearn.*
    ignore:\[W095\].*:UserWarning:spacy.*

# Minimum version
minversion = 7.0
