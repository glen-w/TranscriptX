[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transcriptx-workspaces"
version = "0.1.0"
description = "TranscriptX Streamlit Components v2 high-interaction workspaces (Theme C)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "TranscriptX Team" }]
dependencies = ["streamlit>=1.55.0"]

[project.optional-dependencies]
devel = [
  "wheel",
  "pytest>=7.4.0",
  "playwright>=1.48.0",
  "pytest-playwright>=0.5.0",
]

[tool.setuptools.packages.find]
include = ["transcriptx_workspaces*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
transcriptx_workspaces = [
  "frontend/build/**/*",
  "pyproject.toml",
]
