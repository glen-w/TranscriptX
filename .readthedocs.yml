# Read the Docs scaffold (0.9.5). Project slug / custom domain are owner judgements
# (see docs/dev/pre_release_roadmap_1_0.md §20). Do not publish a live readthedocs.io
# hostname in-repo until the project exists — scripts/release/stale_refs.sh still
# denylists readthedocs.io until then.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
