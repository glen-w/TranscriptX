schema_version: 2
id: default
title: Standard
description: Curated Overview and sectioned Insights for normal viewing.
pages:
  overview:
    page_id: overview
    blocks:
      - placement_id: overview_summary_hero
        block_id: transcript_summary_hero
        visible: true
      - placement_id: overview_at_a_glance
        block_id: at_a_glance
        visible: true
      - placement_id: overview_speaker_cards
        block_id: speaker_summary_cards
        visible: true
      - placement_id: overview_action_items
        block_id: action_items_compact
        visible: true
      - placement_id: overview_highlights
        block_id: highlights_compact
        visible: true
      - placement_id: overview_run_status
        block_id: run_status_compact
        visible: true
  insights:
    page_id: insights
    blocks:
      - placement_id: insights_primary_summary
        block_id: transcript_summary_hero
        section: summary
        visible: true
      - placement_id: insights_other_summaries
        block_id: other_summaries
        section: summary
        visible: true
      - placement_id: insights_llm_speaker_summary
        block_id: llm_speaker_summary_block
        section: speakers
        visible: true
        params:
          title: Per-Speaker LLM Summaries
          empty_hint: Run the `llm_speaker_summary` module (with LLM enabled and named speakers) to populate this view.
      - placement_id: insights_llm_action_items
        block_id: llm_action_items_block
        section: actions
        visible: true
        params:
          title: Meeting extracts
          artifact_stem: _llm_action_items
          empty_hint: Run the `llm_action_items` module (with LLM enabled) to populate this view.
      - placement_id: insights_commitments
        block_id: commitments_table
        section: actions
        visible: true
      - placement_id: insights_highlights
        block_id: highlights
        section: highlights
        visible: true
      - placement_id: insights_contract
        block_id: insights_contract
        section: analysis
        visible: true
      - placement_id: insights_exec_summary
        block_id: executive_summary
        section: analysis
        visible: true
      - placement_id: insights_lexical_diversity
        block_id: lexical_diversity_block
        section: analysis
        visible: true
        params:
          title: Lexical Diversity
          empty_hint: Run the `lexical_diversity` module to populate this view.
      - placement_id: insights_epistemic_markers
        block_id: epistemic_markers_block
        section: analysis
        visible: true
        params:
          title: Epistemic Markers
          empty_hint: Run the `epistemic_markers` module to populate this view.
      - placement_id: insights_politeness
        block_id: politeness_block
        section: analysis
        visible: true
        params:
          title: Politeness Markers
          empty_hint: Run the `politeness` module to populate this view.
  charts:
    page_id: charts
    blocks:
      - placement_id: charts_overview_slots
        block_id: chart_overview_slots
        visible: true
      - placement_id: charts_gallery
        block_id: chart_gallery
        visible: true
