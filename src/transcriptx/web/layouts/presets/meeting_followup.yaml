schema_version: 1
id: meeting_followup
title: Meeting follow-up
description: Post-meeting focus on extracts, commitments, and highlights.
pages:
  overview:
    page_id: overview
    blocks:
      - placement_id: followup_summary_hero
        block_id: transcript_summary_hero
        visible: true
      - placement_id: followup_action_items
        block_id: action_items_compact
        visible: true
      - placement_id: followup_highlights
        block_id: highlights_compact
        visible: true
      - placement_id: followup_at_a_glance
        block_id: at_a_glance
        visible: true
      - placement_id: followup_run_status
        block_id: run_status_compact
        visible: true
  insights:
    page_id: insights
    blocks:
      - placement_id: followup_primary_summary
        block_id: insights_summary_panel
        section: summary
        visible: true
      - placement_id: followup_llm_action_items
        block_id: llm_action_items_block
        section: actions
        visible: true
        params:
          title: Meeting extracts
          artifact_stem: _llm_action_items
          empty_hint: Run the `llm_action_items` module (with LLM enabled) to populate this view.
      - placement_id: followup_commitments
        block_id: commitments_table
        section: actions
        visible: true
      - placement_id: followup_highlights
        block_id: highlights
        section: highlights
        visible: true
  charts:
    page_id: charts
    blocks:
      - placement_id: followup_charts_overview
        block_id: chart_overview_slots
        visible: true
      - placement_id: followup_charts_gallery
        block_id: chart_gallery
        visible: true
