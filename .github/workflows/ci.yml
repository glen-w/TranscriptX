name: CI

# PR merge gate: smoke only (`make test-smoke` on Python 3.10).
# Broader lanes (lint, contracts, Playwright shell, Docker release-checks, docs
# drift, NLP/RAG, Theme C matrix) run locally and on Nightly — see
# docs/ROADMAP.md § CI expansion (deferred). Pages deploy: pages.yml on main.

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TRANSCRIPTX_DISABLE_DOWNLOADS: "1"
  TRANSCRIPTX_LLM_ENABLED: "0"
  TRANSCRIPTX_CORRECTIONS_LLM_ENABLED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install package + test deps
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          python -m pytest --version
      - name: Bootstrap NLTK vader_lexicon for offline smoke
        run: |
          TRANSCRIPTX_DISABLE_DOWNLOADS=0 python - <<'PY'
          import nltk
          nltk.download("vader_lexicon", quiet=True)
          print("nltk vader_lexicon ready")
          PY
      - name: Isolate temp roots
        run: |
          mkdir -p "$RUNNER_TEMP/tx-data" "$RUNNER_TEMP/tx-out"
          echo "TRANSCRIPTX_DATA_DIR=$RUNNER_TEMP/tx-data" >> "$GITHUB_ENV"
          echo "TRANSCRIPTX_OUTPUT_DIR=$RUNNER_TEMP/tx-out" >> "$GITHUB_ENV"
      - name: Smoke
        run: make test-smoke
