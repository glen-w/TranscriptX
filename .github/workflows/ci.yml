name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TRANSCRIPTX_DISABLE_DOWNLOADS: "1"
  TRANSCRIPTX_LLM_ENABLED: "0"
  TRANSCRIPTX_CORRECTIONS_LLM_ENABLED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Assert canonical Compose bind
        run: bash scripts/release/assert_compose_bind.sh

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package + test deps
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          # Confirm pytest entrypoint is on PATH for Makefile targets
          command -v pytest
          python -m pytest --version
      - name: Bootstrap NLTK data for offline smoke
        run: |
          # CI sets TRANSCRIPTX_DISABLE_DOWNLOADS=1; seed required NLTK resources once.
          TRANSCRIPTX_DISABLE_DOWNLOADS=0 python - <<'PY'
          import nltk
          nltk.download("vader_lexicon", quiet=True)
          print("nltk vader_lexicon ready")
          PY
      - name: Isolate temp roots
        run: |
          mkdir -p "$RUNNER_TEMP/tx-data" "$RUNNER_TEMP/tx-out"
          echo "TRANSCRIPTX_DATA_DIR=$RUNNER_TEMP/tx-data" >> "$GITHUB_ENV"
          echo "TRANSCRIPTX_OUTPUT_DIR=$RUNNER_TEMP/tx-out" >> "$GITHUB_ENV"
      - name: Smoke
        run: make test-smoke
      - name: Contracts
        run: make test-contracts
      - name: Fast
        run: make test-fast

  # Thin NLP lane: un-skips spaCy-gated smoke (insight stack, NER, group topics).
  # Single Python version keeps PR cost low while still gating [nlp] regressions.
  tests-nlp:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package + test deps + nlp
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,nlp]"
          command -v pytest
          python -m pytest --version
      - name: Bootstrap NLTK + spaCy model
        run: |
          TRANSCRIPTX_DISABLE_DOWNLOADS=0 python - <<'PY'
          import nltk
          nltk.download("vader_lexicon", quiet=True)
          print("nltk vader_lexicon ready")
          PY
          python -m spacy download en_core_web_md
      - name: Isolate temp roots
        run: |
          mkdir -p "$RUNNER_TEMP/tx-data" "$RUNNER_TEMP/tx-out"
          echo "TRANSCRIPTX_DATA_DIR=$RUNNER_TEMP/tx-data" >> "$GITHUB_ENV"
          echo "TRANSCRIPTX_OUTPUT_DIR=$RUNNER_TEMP/tx-out" >> "$GITHUB_ENV"
          echo "TRANSCRIPTX_SPACY_MODEL=en_core_web_md" >> "$GITHUB_ENV"
      - name: Smoke (nlp)
        run: make test-smoke-nlp
      - name: Contracts (nlp)
        run: make test-contracts

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install docs extras
        run: |
          python -m pip install -U pip
          pip install -e ".[docs]"
      - name: Sphinx HTML build
        run: make docs
      - name: Upload docs HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html/
          if-no-files-found: warn

  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [compose-config, tests, tests-nlp, docs]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package + build tools
        run: |
          python -m pip install -U pip build
          pip install -e ".[dev]"
      - name: Provide Compose recordings bind placeholder
        run: |
          mkdir -p "$RUNNER_TEMP/tx-recordings/imports"
          echo "HOST_RECORDINGS_DIR=$RUNNER_TEMP/tx-recordings" >> "$GITHUB_ENV"
      - name: Tracked data allowlist
        run: python3 scripts/release/check_tracked_data.py
      - name: Denylist / secrets
        run: bash scripts/secrets_check.sh
      - name: Stale refs + TODO gate
        run: bash scripts/release/stale_refs.sh
      - name: "Repo hygiene (strict subset: root allowlist + archive banners)"
        run: python3 scripts/release/repo_hygiene_audit.py --strict --checks root_md,archive_banners
      - name: Repo hygiene audit (full warn mode)
        continue-on-error: true
        run: python3 scripts/release/repo_hygiene_audit.py
      - name: Canonical Compose asserts
        run: bash scripts/release/assert_compose_bind.sh
      - name: Package build + wheel import smoke
        run: |
          python -m build --wheel
          WHEEL=$(ls -1 dist/transcriptx-*.whl | tail -n 1)
          python - <<PY
          import subprocess, sys
          wheel = """$WHEEL"""
          subprocess.check_call([sys.executable, "-m", "pip", "install", "--no-deps", wheel])
          import transcriptx
          print("import ok", transcriptx.__version__)
          PY
      - name: Clean-env audit
        run: bash scripts/release/clean_env_audit.sh
      - name: Fresh Docker build
        run: docker compose -f docker-compose.yml build --pull --no-cache
      - name: Docker smoke
        run: make docker-smoke
      - name: Image pip check
        run: bash scripts/release/image_pip_check.sh
      - name: Worktree cleanliness
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Upload release artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-checks
          path: |
            artifacts/pre-release/
            dist/
          if-no-files-found: warn

  # Theme C: CCv2 workspaces — Streamlit min + current matrix, frontend build, browser harness
  workspaces-theme-c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        streamlit: ["1.55.0", "1.61.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/transcriptx_workspaces/transcriptx_workspaces/frontend/package-lock.json
      - name: Install TranscriptX + workspaces + Streamlit pin
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
          pip install -e packages/transcriptx_workspaces
          pip install "streamlit==${{ matrix.streamlit }}"
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Build + Vitest
        run: make workspaces-build && make test-workspaces
      - name: Clean wheel install smoke
        run: |
          python -m pip install build
          python -m build packages/transcriptx_workspaces
          python -m venv /tmp/tx-ws-wheel
          /tmp/tx-ws-wheel/bin/pip install -U pip
          /tmp/tx-ws-wheel/bin/pip install packages/transcriptx_workspaces/dist/transcriptx_workspaces-*.whl
          /tmp/tx-ws-wheel/bin/python -c "import transcriptx_workspaces; print(transcriptx_workspaces.FRONTEND_BUILD_ID)"
      - name: Browser harness
        run: make test-theme-c-browser
