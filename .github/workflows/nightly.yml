name: Nightly

# Broader lanes that used to block every PR (contracts / fast / coverage) plus
# integration_core. Documented in tests/README.md.
# Docker image smokes stay on PR release-checks / make test-optional — nightly
# does not pre-build transcriptx-web, so requires_docker is excluded.
# Manual: Actions → Nightly → Run workflow.

on:
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TRANSCRIPTX_DISABLE_DOWNLOADS: "1"
  TRANSCRIPTX_LLM_ENABLED: "0"
  TRANSCRIPTX_CORRECTIONS_LLM_ENABLED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # Former PR Gate B: contracts + fast + coverage artifact for the badge workflow.
  gate-b:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install package + test deps + web
        run: |
          python -m pip install -U pip
          # [web] required: contracts + fast collect many Streamlit web modules.
          pip install -e ".[dev,web]"
          command -v pytest
          python -m pytest --version
      - name: Bootstrap NLTK data for offline runs
        run: |
          TRANSCRIPTX_DISABLE_DOWNLOADS=0 python - <<'PY'
          import nltk
          nltk.download("vader_lexicon", quiet=True)
          print("nltk vader_lexicon ready")
          PY
      - name: Isolate temp roots
        run: |
          mkdir -p "$RUNNER_TEMP/tx-data" "$RUNNER_TEMP/tx-out"
          echo "TRANSCRIPTX_DATA_DIR=$RUNNER_TEMP/tx-data" >> "$GITHUB_ENV"
          echo "TRANSCRIPTX_OUTPUT_DIR=$RUNNER_TEMP/tx-out" >> "$GITHUB_ENV"
      - name: Contracts
        run: make test-contracts
      - name: Fast
        run: make test-fast
      - name: Coverage JSON
        run: make test-coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: coverage.json
          if-no-files-found: warn

  integration-core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package + test deps + nlp + web
        run: |
          python -m pip install -U pip
          # [web] for contract/web imports; [nlp] for summary→highlights integration_core paths.
          pip install -e ".[dev,nlp,web]"
          command -v pytest
          python -m pytest --version
      - name: Bootstrap spaCy model for offline runs
        run: python -m spacy download en_core_web_md
      - name: Bootstrap NLTK data for offline runs
        run: |
          TRANSCRIPTX_DISABLE_DOWNLOADS=0 python - <<'PY'
          import nltk
          nltk.download("vader_lexicon", quiet=True)
          print("nltk vader_lexicon ready")
          PY
      - name: Isolate temp roots
        run: |
          mkdir -p "$RUNNER_TEMP/tx-data" "$RUNNER_TEMP/tx-out" "$RUNNER_TEMP/tx-recordings/imports"
          echo "TRANSCRIPTX_DATA_DIR=$RUNNER_TEMP/tx-data" >> "$GITHUB_ENV"
          echo "TRANSCRIPTX_OUTPUT_DIR=$RUNNER_TEMP/tx-out" >> "$GITHUB_ENV"
          echo "HOST_RECORDINGS_DIR=$RUNNER_TEMP/tx-recordings" >> "$GITHUB_ENV"
      - name: Integration core
        run: make test-integration-core
      # Rest of tests/integration (DAG pipeline etc.); no other scheduled lane runs it.
      - name: Integration extended
        if: always()
        run: make test-integration-extended
